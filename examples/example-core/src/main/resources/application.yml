# Default configuration file, the one KafkaRetryableConfiguration.load() finds on its own.
# Read by DefaultConfigurationFileExample; the other examples each name their own file instead.
kafka:
  retryable:
    name: default-configuration-example
    consumer:
      topics: default-configuration-example
      # Exceptions listed here bypass the retry mechanism and go straight to the dead letter topic
      not-retryable-exceptions:
        - java.lang.IllegalArgumentException
      # false: an unrecoverable record is sent to the dead letter topic and the consumer carries on
      stop-on-error: false
      retry:
        max: 3 # 0 would mean infinite retry
        backoff:
          ms: 500
      poll:
        backoff:
          ms: 1000
      properties: # Plain Kafka consumer properties
        bootstrap:
          servers: localhost:9092
        group:
          id: default-configuration-example
        auto:
          offset:
            reset: earliest
        enable:
          auto:
            commit: false # The library commits offsets itself, once the processing succeeded
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
    dead-letter:
      producer:
        topic: default-configuration-example-dlt
        properties:
          bootstrap:
            servers: localhost:9092
          # The dead letter payload is an Avro record, hence the registry and the Avro serializer
          schema:
            registry:
              url: http://localhost:8081
          key:
            serializer: org.apache.kafka.common.serialization.StringSerializer
          value:
            serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
