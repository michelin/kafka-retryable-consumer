# Configuration of DeadLetterConfiguration, selected by spring.config.name=dead-letter.
# A bounded retry budget, then the record is routed to the dead letter topic.
# Beware: the starter binds flat, kebab-case keys, unlike the nested form used by the core module.
kafka:
  retryable:
    consumer:
      topics: spring-dead-letter
      retry-max: 2 # The initial attempt plus two retries, then the record is given up on
      retry-backoff-ms: 500 # Wait between two attempts instead of hammering the downstream system
      # Exceptions listed here bypass the retry mechanism and go straight to the dead letter topic
      not-retryable-exceptions:
        - java.lang.IllegalArgumentException
      properties: # Plain Kafka consumer properties
        bootstrap.servers: localhost:9092
        group.id: spring-dead-letter
        auto.offset.reset: earliest
        enable.auto.commit: false # The library commits offsets itself, once the processing succeeded
        # The starter injects these two as a fallback, but only for the consumer it builds itself.
        # Declaring them explicitly is what makes a hand written consumer bean work as well.
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
    dead-letter:
      producer:
        topic: spring-dead-letter-dlt # Declaring this topic is all it takes for the starter to wire a dead letter producer
        properties:
          bootstrap.servers: localhost:9092
          # The dead letter payload is an Avro record. The starter falls back on a string serializer, which cannot
          # encode it, so both properties below are required for the dead letter topic to actually work.
          schema.registry.url: http://localhost:8081
          key.serializer: org.apache.kafka.common.serialization.StringSerializer
          value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

logging:
  level:
    com.michelin.kafka: INFO
