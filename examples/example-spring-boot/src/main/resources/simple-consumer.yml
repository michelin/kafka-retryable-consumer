# Configuration of SimpleConsumerRunner, selected by spring.config.name=simple-consumer.
# The baseline: no retry tuning at all, everything is left at its default value.
# Beware: the starter binds flat, kebab-case keys, unlike the nested form used by the core module.
kafka:
  retryable:
    consumer:
      topics: spring-simple-consumer
      properties: # Plain Kafka consumer properties
        bootstrap.servers: localhost:9092
        group.id: spring-simple-consumer
        auto.offset.reset: earliest
        enable.auto.commit: false # The library commits offsets itself, once the processing succeeded
        # The starter injects these two as a fallback, but only for the consumer it builds itself.
        # Declaring them explicitly is what makes a hand written consumer bean work as well.
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
    dead-letter:
      producer:
        topic: spring-simple-consumer-dlt
        properties:
          bootstrap.servers: localhost:9092
          # The dead letter payload is an Avro record. The starter falls back on a string serializer, which cannot
          # encode it, so both properties below are required for the dead letter topic to actually work.
          schema.registry.url: http://localhost:8081
          key.serializer: org.apache.kafka.common.serialization.StringSerializer
          value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

logging:
  level:
    com.michelin.kafka: INFO
